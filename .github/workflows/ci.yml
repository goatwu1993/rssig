name: Rust verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Check formatting and Clippy
        run: make lint

  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - name: Run Rust tests against committed fixtures
        run: cargo test --locked

  library-features:
    name: Library features and no_std
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Rust and a target without std
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: thumbv7em-none-eabi
          components: clippy
      - name: Check the parser without std or host dependencies
        run: cargo clippy --locked --lib --no-default-features --target thumbv7em-none-eabi -- -D warnings
      - name: Check the optional XML adapter without std
        run: cargo clippy --locked --lib --no-default-features --features xml --target thumbv7em-none-eabi -- -D warnings
      - name: Test parser-only builds
        run: |
          cargo test --locked --no-default-features
          cargo test --locked --no-default-features --features xml
          cargo test --locked --no-default-features --features std
      - name: Test verification without CLI or native roots
        run: cargo test --locked --no-default-features --features verify
      - name: Test CLI with explicit roots only
        run: cargo test --locked --no-default-features --features cli

  coverage:
    name: Coverage (Cobertura and HTML)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      checks: write
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Rust with coverage tools
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: llvm-tools-preview
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2
        with:
          tool: cargo-llvm-cov@0.9.1
      - name: Run native tests and the independent CLI specification
        run: make coverage
      - name: Upload coverage reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage
          path: target/coverage/
          if-no-files-found: error
          retention-days: 14
      - name: Comment coverage on the pull request
        if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
        uses: goatwu1993/actions/coverage-action@b82e05f593b2c91141c5f74c7af6d45d8fe02334 # main
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          path: target/coverage/cobertura.xml
          minimum_coverage: 0
          fail_below_threshold: false
