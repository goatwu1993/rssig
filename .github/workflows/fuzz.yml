name: Fuzz

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly longer run, Mondays 03:17 UTC.
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds to fuzz each target (at most 1800)
        default: "300"

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: Fuzz all targets
    runs-on: ubuntu-latest
    # Ten targets at the 1800 second maximum is five hours, plus one build.
    timeout-minutes: 345
    env:
      CARGO_TERM_COLOR: always
      # 60 seconds per target on pushes and pull requests, 900 weekly.
      FUZZ_SECONDS: ${{ inputs.seconds || (github.event_name == 'schedule' && '900') || '60' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check the requested duration
        run: |
          case "$FUZZ_SECONDS" in
            ''|*[!0-9]*) echo "seconds must be a whole number"; exit 1 ;;
          esac
          if [ "$FUZZ_SECONDS" -gt 1800 ]; then
            echo "seconds must be at most 1800 to fit the job timeout"; exit 1
          fi
      - name: Install nightly Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: nightly
      - name: Install cargo-fuzz
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2
        with:
          tool: cargo-fuzz@0.13.2
      # Reuse inputs discovered by earlier runs on main. Pull requests read
      # this cache but never write it.
      - name: Restore the accumulated corpus
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-
      - name: Fuzz every target in fuzz/targets.txt
        run: make fuzz
      - name: Minimize the corpus
        if: github.event_name != 'pull_request'
        run: make fuzz-cmin
      - name: Save the corpus
        if: github.event_name != 'pull_request'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}
      - name: Upload crashing inputs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
          if-no-files-found: ignore
          retention-days: 14
