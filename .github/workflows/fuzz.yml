name: Fuzz

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly longer run, Mondays 03:17 UTC.
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds to fuzz each target (at most 16200 divided by the number of targets)
        default: "300"

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: Fuzz all targets
    runs-on: ubuntu-latest
    # 270 minutes of fuzzing shared by every target in fuzz/targets.txt (the
    # duration check below enforces it), leaving 75 for the toolchain, build,
    # corpus cache and minimization.
    timeout-minutes: 345
    env:
      CARGO_TERM_COLOR: always
      # 60 seconds per target on pushes and pull requests, 900 weekly.
      FUZZ_SECONDS: ${{ inputs.seconds || (github.event_name == 'schedule' && '900') || '60' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check the requested duration
        run: |
          case "$FUZZ_SECONDS" in
            ''|*[!0-9]*) echo "seconds must be a whole number"; exit 1 ;;
            # Over six digits is never valid, and would overflow `[ -gt ]`.
            ???????*) echo "seconds must be at most 999999"; exit 1 ;;
          esac
          # libFuzzer reads -max_total_time=0 as no limit.
          if [ "$FUZZ_SECONDS" -eq 0 ]; then
            echo "seconds must be at least 1"; exit 1
          fi
          # `grep -c .` counts a last line without a trailing newline too.
          targets=$(sed -e 's/#.*//' -e '/^[[:space:]]*$/d' fuzz/targets.txt | grep -c .) || true
          if [ "$targets" -eq 0 ]; then
            echo "fuzz/targets.txt lists no targets"; exit 1
          fi
          max=$((16200 / targets))
          if [ "$max" -eq 0 ]; then
            echo "$targets targets cannot share 270 minutes"; exit 1
          fi
          if [ "$FUZZ_SECONDS" -gt "$max" ]; then
            # A requested duration is refused; the fixed push, pull-request
            # and weekly durations shrink to fit as targets are added.
            if [ "${{ github.event_name }}" = workflow_dispatch ]; then
              echo "seconds must be at most $max: $targets targets share 270 minutes of the job timeout"; exit 1
            fi
            echo "FUZZ_SECONDS=$max" >> "$GITHUB_ENV"
          fi
      - name: Install nightly Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: nightly
      - name: Install cargo-fuzz
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2
        with:
          tool: cargo-fuzz@0.13.2
      # Reuse inputs discovered by earlier runs on main. Pull requests read
      # this cache but never write it.
      - name: Restore the accumulated corpus
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-
      - name: Fuzz every target in fuzz/targets.txt
        run: make fuzz
      - name: Minimize the corpus
        if: github.event_name != 'pull_request'
        run: make fuzz-cmin
      - name: Save the corpus
        if: github.event_name != 'pull_request'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}
      - name: Upload crashing inputs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
          if-no-files-found: ignore
          retention-days: 14
