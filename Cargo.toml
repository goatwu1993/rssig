[package]
name = "rssig"
version = "0.1.0"
edition = "2024"
description = "Cross-platform embedded Windows PE Authenticode signature verifier"
license = "Apache-2.0"

[features]
default = ["cli", "system-roots"]
# The parser only needs core + alloc. Host integrations are opt-in for libraries.
std = ["anyhow/std", "der/std", "x509-cert/std", "roxmltree?/std", "serde?/std", "serde_json?/std", "signature?/std"]
xml = ["dep:roxmltree"]
# Structural host adapters, independent of verification and reports.
msi = ["std", "dep:cfb"]
appx = ["std", "xml", "dep:flate2", "dep:crc32fast"]
verify = ["verify-core", "msi", "appx"]
verify-core = [
    "xml",
    "dep:rustls-pki-types", "dep:webpki", "dep:rsa", "dep:sha1", "dep:sha2",
    "dep:p256", "dep:p384", "dep:signature", "dep:serde", "dep:serde_json",
    "x509-cert/pem",
]
crl-fetch = ["verify", "dep:url", "dep:httparse"]
cli = ["verify", "crl-fetch", "dep:clap", "dep:libc"]
system-roots = ["verify", "dep:rustls-native-certs"]

[[bin]]
name = "rssig"
path = "src/main.rs"
required-features = ["cli"]

[[test]]
name = "cli"
required-features = ["cli"]

[[test]]
name = "cli_interface"
required-features = ["cli"]

[[test]]
name = "spec"
required-features = ["cli"]

[[test]]
name = "fixtures"
required-features = ["verify"]

[[test]]
name = "parse"
required-features = ["verify"]

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
# Keep individual lint overrides above the group priority.
all = { level = "warn", priority = -1 }
correctness = { level = "deny", priority = 0 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[dependencies]
url = { version = "2.5", optional = true }
httparse = { version = "1.10", optional = true }
libc = { version = "0.2", optional = true, default-features = false }
flate2 = { version = "1", optional = true, default-features = false, features = ["rust_backend"] }
crc32fast = { version = "1", optional = true }
roxmltree = { version = "0.21", optional = true, default-features = false, features = ["positions"] }
base64ct = { version = "1", default-features = false, features = ["alloc"] }
anyhow = { version = "1", default-features = false }
clap = { version = "4", optional = true, features = ["derive"] }
der = { version = "0.7", default-features = false, features = ["alloc", "derive", "oid"] }
digest = { version = "0.10", default-features = false }
x509-cert = { version = "0.2", default-features = false }
rustls-native-certs = { version = "0.8", optional = true }
rustls-pki-types = { version = "1", optional = true, default-features = false, features = ["alloc"] }
webpki = { package = "rustls-webpki", version = "0.103", optional = true, default-features = false, features = ["alloc"] }
rsa = { version = "0.9", optional = true, default-features = false, features = ["sha2", "u64_digit"] }
sha1 = { version = "0.10", optional = true, default-features = false, features = ["oid"] }
sha2 = { version = "0.10", optional = true, default-features = false, features = ["oid"] }
p256 = { version = "0.13", optional = true, default-features = false, features = ["ecdsa", "alloc", "pkcs8"] }
p384 = { version = "0.13", optional = true, default-features = false, features = ["ecdsa", "alloc", "pkcs8"] }
signature = { version = "2", optional = true }
serde = { version = "1", optional = true, default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1", optional = true, default-features = false, features = ["alloc"] }
cfb = { version = "0.15", optional = true, default-features = false }

[dev-dependencies]
rsa = { version = "0.9", features = ["pem"] }
p256 = { version = "0.13", features = ["ecdsa", "pem"] }
rand = "0.8"
sha2 = { version = "0.10", features = ["oid"] }
x509-cert = { version = "0.2", features = ["builder"] }

[profile.release]
lto = true
strip = true
