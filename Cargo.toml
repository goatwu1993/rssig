[package]
name = "rssig"
version = "0.1.0"
edition = "2024"
description = "Cross-platform embedded Windows PE Authenticode signature verifier"
license = "Apache-2.0"

[features]
default = ["cli", "system-roots"]
# The parser only needs core + alloc. Host integrations are opt-in for libraries.
std = ["anyhow/std", "der/std", "x509-cert/std"]
verify = [
    "std", "dep:flate2", "dep:crc32fast", "dep:roxmltree", "dep:base64ct",
    "dep:rustls-pki-types", "dep:webpki", "dep:rsa", "dep:sha1", "dep:sha2",
    "dep:p256", "dep:p384", "dep:signature", "dep:serde", "dep:serde_json",
    "dep:cfb", "x509-cert/pem",
]
cli = ["verify", "dep:clap"]
system-roots = ["verify", "dep:rustls-native-certs"]

[[bin]]
name = "rssig"
path = "src/main.rs"
required-features = ["cli"]

[[test]]
name = "cli"
required-features = ["cli"]

[[test]]
name = "cli_interface"
required-features = ["cli"]

[[test]]
name = "spec"
required-features = ["cli"]

[[test]]
name = "fixtures"
required-features = ["verify"]

[[test]]
name = "parse"
required-features = ["verify"]

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
# Keep individual lint overrides above the group priority.
all = { level = "warn", priority = -1 }
correctness = { level = "deny", priority = 0 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[dependencies]
flate2 = { version = "1", optional = true, default-features = false, features = ["rust_backend"] }
crc32fast = { version = "1", optional = true }
roxmltree = { version = "0.21", optional = true }
base64ct = { version = "1", optional = true, features = ["alloc"] }
anyhow = { version = "1", default-features = false }
clap = { version = "4", optional = true, features = ["derive"] }
der = { version = "0.7", default-features = false, features = ["alloc", "derive", "oid"] }
x509-cert = { version = "0.2", default-features = false }
rustls-native-certs = { version = "0.8", optional = true }
rustls-pki-types = { version = "1", optional = true, features = ["std"] }
webpki = { package = "rustls-webpki", version = "0.103", optional = true, default-features = false, features = ["std"] }
rsa = { version = "0.9", optional = true, features = ["sha2"] }
sha1 = { version = "0.10", optional = true, features = ["oid"] }
sha2 = { version = "0.10", optional = true, features = ["oid"] }
p256 = { version = "0.13", optional = true, features = ["ecdsa"] }
p384 = { version = "0.13", optional = true, features = ["ecdsa"] }
signature = { version = "2", optional = true }
serde = { version = "1", optional = true, features = ["derive"] }
serde_json = { version = "1", optional = true }
cfb = { version = "0.15", optional = true, default-features = false }

[dev-dependencies]
rand = "0.8"
sha2 = { version = "0.10", features = ["oid"] }
x509-cert = { version = "0.2", features = ["builder"] }

[profile.release]
lto = true
strip = true
