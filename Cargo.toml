# Two packages, one per layer:
#
#   engine/  `rssig-engine`: pure verification logic, policy options and the
#            collaborator interfaces (`CrlSource`, `Logger`). No I/O, clock or OS roots.
#   ./       `rssig`: the application. The CLI and the default collaborators
#            the engine leaves to its caller: the HTTP CRL source, OS root
#            enumeration, host limits and the default policy.
#
# `cargo test --locked` at the root runs both packages (`default-members`).
[workspace]
# The root package is a member implicitly. Naming "." here would make every
# path below the root an explicit member, which defeats `exclude`.
members = ["engine"]
default-members = [".", "engine"]
# The read-only reference clones kept at the repository root (.gitignore) are
# not members: without this, running Cargo inside a Rust one fails, because
# Cargo takes it for a stray member of this workspace.
exclude = [
    "jsign", "relic", "osslsigncode", "authenticode-rs", "authenticode-parser",
    "cross-authenticode", "rsigncode", "pe-sign", "verifysign",
]
resolver = "3"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
# Keep individual lint overrides above the group priority.
all = { level = "warn", priority = -1 }
correctness = { level = "deny", priority = 0 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[workspace.dependencies]
anyhow = { version = "1", default-features = false }
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
url = { version = "2.5" }
rustls-pki-types = { version = "1", default-features = false, features = ["alloc"] }
# Pinned exactly: CRL authority and path behavior are documented as observed at
# this version (docs/tasks/crl-t001.md). Upgrade deliberately; one pin serves
# the engine and the application's anchor test.
webpki = { package = "rustls-webpki", version = "=0.103.16", default-features = false, features = ["alloc"] }
x509-cert = { version = "0.2", default-features = false }

[package]
name = "rssig"
version = "0.1.0"
edition = "2024"
description = "Cross-platform embedded Windows PE Authenticode signature verifier"
license = "Apache-2.0"
# The published crate is the application only. Tests, fixtures, documentation
# and repository housekeeping stay in the repository.
include = ["/src/**", "/README.md", "/LICENSE", "/NOTICE"]

[features]
default = ["cli", "system-roots"]
# The default CRL source: bounded public HTTP.
crl-fetch = ["rssig-engine/retrieval", "dep:url", "dep:httparse", "dep:serde_json"]
cli = ["crl-fetch", "dep:clap", "dep:libc", "dep:anyhow", "dep:serde", "dep:serde_json"]
# The default root source: the operating system's store.
system-roots = ["dep:rustls-native-certs"]

[[bin]]
name = "rssig"
path = "src/main.rs"
required-features = ["cli"]

[[test]]
name = "cli"
required-features = ["cli"]

[[test]]
name = "cli_interface"
required-features = ["cli"]

[[test]]
name = "spec"
required-features = ["cli"]

[lints]
workspace = true

[dependencies]
rssig-engine = { path = "engine", version = "0.1.0", default-features = false, features = ["verify"] }
anyhow = { workspace = true, features = ["std"], optional = true }
serde = { workspace = true, features = ["std"], optional = true }
serde_json = { workspace = true, features = ["std"], optional = true }
url = { workspace = true, optional = true }
httparse = { version = "1.10", optional = true }
libc = { version = "0.2", optional = true, default-features = false }
clap = { version = "4", optional = true, features = ["derive"] }
rustls-native-certs = { version = "0.8", optional = true }

[dev-dependencies]
# The specification runner and manifest checks deserialize JSON in every
# feature configuration, not only with `cli`.
serde = { workspace = true, features = ["std"] }
serde_json = { workspace = true, features = ["std"] }
# Runs every test with the engine's test-only revocation cross-check. See the
# engine's `revocation-crosscheck` feature.
rssig-engine = { path = "engine", default-features = false, features = ["revocation-crosscheck"] }
sha2 = { version = "0.10", features = ["oid"] }
x509-cert = { workspace = true }
# tests/cli/trust_loading.rs checks that webpki accepts each committed anchor,
# at the engine's pinned version (the workspace pin).
rustls-pki-types = { workspace = true }
webpki = { workspace = true }
# Parses Rust test and generator sources for tests/manifest.rs. Already in the
# lockfile through serde_derive.
syn = { version = "2", default-features = false, features = ["full", "parsing", "visit"] }
# The specification runner compares a scripted URL with the listed points
# after normalization, as the engine does. Already a dependency of `crl-fetch`.
url = { workspace = true }
# Parses the frontmatter of each .claude/skills/*/SKILL.md for the repository
# checks in tests/repository.rs (DOC-T013); DOC-T010 is to reuse it for
# scopes.yml. Pure Rust, YAML 1.2; a dev-dependency of this package only.
yaml-rust2 = { version = "0.13", default-features = false }

[profile.release]
lto = true
strip = true
