[package]
name = "rssig"
version = "0.1.0"
edition = "2024"
description = "Cross-platform embedded Windows PE Authenticode signature verifier"
license = "Apache-2.0"

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
# Keep individual lint overrides above the group priority.
all = { level = "warn", priority = -1 }
correctness = { level = "deny", priority = 0 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[dependencies]
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
crc32fast = "1"
roxmltree = "0.21"
base64ct = { version = "1", features = ["alloc"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
der = { version = "0.7", features = ["alloc", "derive", "oid"] }
x509-cert = { version = "0.2", features = ["pem"] }
rustls-native-certs = "0.8"
rustls-pki-types = { version = "1", features = ["std"] }
webpki = { package = "rustls-webpki", version = "0.103", default-features = false, features = ["std"] }
rsa = { version = "0.9", features = ["sha2"] }
sha1 = { version = "0.10", features = ["oid"] }
sha2 = { version = "0.10", features = ["oid"] }
p256 = { version = "0.13", features = ["ecdsa"] }
p384 = { version = "0.13", features = ["ecdsa"] }
signature = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cfb = { version = "0.15", default-features = false }

[dev-dependencies]
rand = "0.8"
x509-cert = { version = "0.2", features = ["builder"] }

[profile.release]
lto = true
strip = true
